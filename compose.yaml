name: turminha-local
services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: turminha_saas_dev
      MYSQL_USER: turminha
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev-only-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-only-root-change-me}
      TZ: America/Sao_Paulo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks: [turminha-local]

  redis:
    image: redis:8.8.3-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [turminha-local]

  storage:
    image: ghcr.io/rustfs/rustfs:1.0.4-glibc
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-turminha-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-dev-only-storage-secret-change-me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 4s
      retries: 15
      start_period: 15s
    networks: [turminha-local]

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [turminha-local]

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [turminha-local]

networks:
  turminha-local:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  storage-data:
  clamav-data:
